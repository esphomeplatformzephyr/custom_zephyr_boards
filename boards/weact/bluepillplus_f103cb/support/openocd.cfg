# This board has no board-specific "board/*.cfg" preset upstream (unlike
# nucleo_f103rb, which ships its own via ST-Link-on-board) -- generic
# interface + target config for an external ST-Link, same style as this
# repo's own weact/stm32g0b1_core/support/openocd.cfg. Classic HLA
# interface/stlink.cfg (not stlink-dap.cfg's dapdirect_swd), since older/
# clone ST-Link/V2 probes without v2j24+ firmware don't support DAP mode.
source [find interface/stlink.cfg]

source [find target/stm32f1x.cfg]

# WeAct's own header is 4-pin ("1x4 SW pins" per their HDK doc): SWCLK/SWDIO/GND/3V3
# only, no separate NRST line -- srst_only timed out waiting for a hardware reset that
# has no physical pin to arrive on. `none` uses the Cortex-M debug port's own software
# system reset (AIRCR.SYSRESETREQ) instead, which needs no NRST wire at all.
reset_config none

$_TARGETNAME configure -event gdb-attach {
	echo "Debugger attaching: halting execution"
	reset halt
	gdb_breakpoint_override hard
}

$_TARGETNAME configure -event gdb-detach {
	echo "Debugger detaching: resuming execution"
	resume
}
